name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.buildtype }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            buildtype: release
            toolchain_script: /app/toolchain/gcc-14/env.sh
          - compiler: gcc
            cc: gcc
            cxx: g++
            buildtype: debug
            toolchain_script: /app/toolchain/gcc-14/env.sh
          - compiler: clang
            cc: clang
            cxx: clang++
            buildtype: release
            toolchain_script: /app/toolchain/gcc-14/env.sh

    container:
      image: armintoepfer/navalia:20260212

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        run: |
          source ${{ matrix.toolchain_script }}
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          meson setup build \
            --buildtype=${{ matrix.buildtype }} \
            --wrap-mode=forcefallback \
            -Dtests=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
